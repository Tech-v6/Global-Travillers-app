name: Build Android AAB for Google Play signing

on:
  push:
    branches:
      - main
      - master
      - release
    paths:
      - 'android/**'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - '*.gradle'
      - '*.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Gradle wrapper
        id: gradle
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "workdir=." >> "$GITHUB_OUTPUT"
          elif [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
            echo "workdir=android" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not find a Gradle wrapper at ./gradlew or ./android/gradlew."
            exit 1
          fi

      - name: Build release AAB
        working-directory: ${{ steps.gradle.outputs.workdir }}
        shell: bash
        run: ./gradlew bundleRelease

      - name: Locate generated AAB
        id: aab
        working-directory: ${{ steps.gradle.outputs.workdir }}
        shell: bash
        run: |
          AAB_PATH="$(find . -type f -path '*/build/outputs/bundle/*/*.aab' | sort | head -n 1)"
          if [ -z "$AAB_PATH" ]; then
            echo "::error::No Android App Bundle was generated."
            exit 1
          fi

          echo "path=$(realpath "$AAB_PATH")" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$AAB_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload release AAB
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-for-google-play-signing
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish build summary
        env:
          AAB_FILE: ${{ steps.aab.outputs.filename }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        shell: bash
        run: |
          {
            echo "## Android App Bundle ready for Google Play"
            echo
            echo "- File: \`$AAB_FILE\`"
            echo "- Download: $ARTIFACT_URL"
            echo "- Next step: upload this AAB in Google Play Console."
            echo "- Google Play App Signing handles production signing."
          } >> "$GITHUB_STEP_SUMMARY"
