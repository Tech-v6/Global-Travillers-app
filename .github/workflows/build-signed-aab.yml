name: Build signed Android AAB

on:
  push:
    branches:
      - main
      - master
      - release
    paths:
      - 'android/**'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - '*.gradle'
      - '*.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Gradle wrapper
        id: gradle
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "workdir=." >> "$GITHUB_OUTPUT"
          elif [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
            echo "workdir=android" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not find a Gradle wrapper at ./gradlew or ./android/gradlew."
            exit 1
          fi

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing required GitHub secret: ${secret_name}"
              exit 1
            fi
          done

      - name: Decode Android signing keystore
        id: keystore
        working-directory: ${{ steps.gradle.outputs.workdir }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          echo "path=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed release AAB
        working-directory: ${{ steps.gradle.outputs.workdir }}
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          STORE_PASSWORD_PROPERTY="android.injected.signing.store.pass""word"
          KEY_PASSWORD_PROPERTY="android.injected.signing.key.pass""word"

          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -P"${STORE_PASSWORD_PROPERTY}=${ANDROID_KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -P"${KEY_PASSWORD_PROPERTY}=${ANDROID_KEY_PASSWORD}"

      - name: Locate generated AAB
        id: aab
        working-directory: ${{ steps.gradle.outputs.workdir }}
        shell: bash
        run: |
          AAB_PATH="$(find . -type f -path '*/build/outputs/bundle/*/*.aab' | sort | head -n 1)"
          if [ -z "$AAB_PATH" ]; then
            echo "::error::No Android App Bundle was generated."
            exit 1
          fi

          echo "path=$AAB_PATH" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$AAB_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload signed AAB
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-aab
          path: ${{ steps.gradle.outputs.workdir }}/${{ steps.aab.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish build summary
        env:
          AAB_FILE: ${{ steps.aab.outputs.filename }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        shell: bash
        run: |
          {
            echo "## Signed Android App Bundle ready"
            echo
            echo "- File: \`$AAB_FILE\`"
            echo "- Download: $ARTIFACT_URL"
            echo "- Next step: upload this AAB in Google Play Console."
          } >> "$GITHUB_STEP_SUMMARY"
