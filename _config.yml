# OminiTrain App — GitHub Pages configuration

title: OminiTrain App
description: OminiTrain App — Your Journey, Everywhere. Journey planning, travel information, stations and destinations, active journeys, reminders, travel assistance and OminiJourney Memory.
baseurl: /Global-Travillers-app
url: https://tech-v6.github.io

author:
  name: OminiTrain App
  url: https://station-light.lovable.app
  email: cusmasobi888@gmail.com

logo: /assets/ominitrain-logo.png
social:
  name: OminiTrain App
  links:
    - https://station-light.lovable.app

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

lang: en

sass:
  style: compressed

exclude:
  - .github
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - app/
  - gradle/
  - gradlew
  - build.gradle.kts
  - settings.gradle.kts
  - gradle.properties
  - node_modules/
  - vendor/

include:
  - .nojekyll

future: false
show_drafts: false
